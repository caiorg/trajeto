name: Pendências do PR

# No merge, cria uma issue por item da seção "## Pendências" do corpo do PR
# e comenta nas issues citadas. Formato em .github/scripts/pendencias.ts.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pendencias-${{ github.event.pull_request.number }}

jobs:
  registrar:
    # PR de fork recebe token só de leitura em pull_request; esse fluxo é dos agentes, que abrem PR no próprio repo.
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun .github/scripts/pendencias.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
